name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: myapp
  IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest pytest-cov pytest-flask

      - name: Run unit tests
        run: |
          cd app
          pytest tests/ -v --cov=. --cov-report=xml

      - name: Run linting
        run: |
          pip install flake8
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./app/coverage.xml
          flags: unittests

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Scan dependencies for vulnerabilities
        run: |
          pip install safety
          safety check --json --file app/requirements.txt || true

  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Set Terraform environment
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "TF_ENVIRONMENT=prod" >> "$GITHUB_ENV"
          else
            echo "TF_ENVIRONMENT=dev" >> "$GITHUB_ENV"
          fi

      - name: Terraform Init
        run: |
          cd terraform
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=myapp/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan -var-file="environments/${TF_ENVIRONMENT}.tfvars" -out=tfplan

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -auto-approve tfplan

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security-scan, deploy-infrastructure]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f app/Dockerfile app/
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Scan image for vulnerabilities in image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to staging environment
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here
          # Example: aws ecs update-service --cluster staging --service myapp --force-new-deployment

      - name: Notify deployment
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Staging deployment successful for ${{ github.repository }}"
        continue-on-error: true

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url: https://myapp.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Manual approval for production
        run: |
          echo "Production deployment requires manual approval"
          echo "Check GitHub Actions environment protection rules"

      - name: Deploy to production environment
        env:
          ASG_NAME: myapp-asg-prod
        run: |
          instance_ids=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text)
          if [ -z "$instance_ids" ]; then
            echo "No InService instances found in $ASG_NAME"
            aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME"
            exit 1
          fi

          online_instance_ids=""
          for attempt in {1..30}; do
            online_instance_ids=""
            for instance_id in $instance_ids; do
              ping_status=$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$instance_id" \
                --query 'InstanceInformationList[0].PingStatus' --output text)
              if [ "$ping_status" = "Online" ]; then
                online_instance_ids="$online_instance_ids $instance_id"
              fi
            done
            online_instance_ids=$(echo "$online_instance_ids" | xargs)
            expected_count=$(echo "$instance_ids" | wc -w)
            online_count=$(echo "$online_instance_ids" | wc -w)
            if [ "$online_count" -eq "$expected_count" ]; then
              break
            fi
            echo "Waiting for all InService instances to become SSM-online (attempt $attempt/30)"
            sleep 20
          done

          expected_count=$(echo "$instance_ids" | wc -w)
          online_count=$(echo "$online_instance_ids" | wc -w)
          if [ "$online_count" -ne "$expected_count" ]; then
            echo "Only $online_count of $expected_count InService instances are online in SSM"
            for instance_id in $instance_ids; do
              echo "SSM status for $instance_id:"
              aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$instance_id" \
                --output table || true
            done
            aws ssm describe-instance-information --output table
            exit 1
          fi
          echo "Deploying to SSM-online instances: $online_instance_ids"

          commands='["set -e", "cd /opt/app", "docker-compose pull app", "docker-compose up -d --force-recreate app", "for attempt in $(seq 1 12); do if curl -fsS http://localhost:8000/health/ready >/dev/null; then exit 0; fi; sleep 10; done; docker-compose ps; docker-compose logs --tail=100 app; exit 1"]'
          command_id=$(aws ssm send-command \
            --instance-ids $online_instance_ids \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA}" \
            --timeout-seconds 600 \
            --parameters "{\"commands\":$commands}" \
            --query 'Command.CommandId' --output text)

          deployment_failed=0
          for instance_id in $online_instance_ids; do
            command_status="InProgress"
            for attempt in {1..36}; do
              command_status=$(aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$instance_id" \
                --query 'Status' --output text)
              case "$command_status" in
                Success|Failed|TimedOut|Cancelled|Cancelling|Undeliverable|Terminated)
                  break
                  ;;
              esac
              sleep 10
            done

            if [ "$command_status" != "Success" ]; then
              deployment_failed=1
              echo "Remote deployment status on $instance_id: $command_status"
            fi
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance_id" \
              --query '{Status:Status,ResponseCode:ResponseCode,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
              --output json || true
          done
          if [ "$deployment_failed" -ne 0 ]; then
            exit 1
          fi

      - name: Run smoke tests
        run: |
          alb_dns=$(aws elbv2 describe-load-balancers \
            --names myapp-alb-prod --query 'LoadBalancers[0].DNSName' --output text)
          curl --fail --silent --show-error "http://$alb_dns/health/live"
          curl --fail --silent --show-error "http://$alb_dns/" | grep -q "Ops Console"

      - name: Notify deployment
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Production deployment successful for ${{ github.repository }}"
        continue-on-error: true
